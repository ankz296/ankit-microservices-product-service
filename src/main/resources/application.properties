spring.application.name=product-service
spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
product.search.enabled=${PRODUCT_SEARCH_ENABLED:true}
product.search.reindex-on-startup=${PRODUCT_SEARCH_REINDEX_ON_STARTUP:false}
management.health.elasticsearch.enabled=false
